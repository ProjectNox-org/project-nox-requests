name: Guardião de Encerramento de Issues

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  check-resolution:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar se Issue possui label de resolução
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) return;
            const labels = (issue.labels || []).map(l => typeof l === 'string' ? l : l.name);
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            };

            // Garantir label oficial Duplicado em qualquer fechamento formal como duplicate
            if (issue.state_reason === 'duplicate' && !labels.includes('Duplicado')) {
              await github.rest.issues.addLabels({ ...params, labels: ['Duplicado'] });
            }

            // Remover status de triagem inicial em Issues encerradas sem tocar categoria/tipo/+18
            for (const stale of ['Em análise', 'Aguardando informações', 'status:triage', 'status:needs-info']) {
              if (labels.includes(stale)) {
                try {
                  await github.rest.issues.removeLabel({ ...params, name: stale });
                } catch (err) {
                  if (err.status !== 404) console.warn(`Falha ao remover label ${stale}:`, err.message);
                }
              }
            }

            const hasResolution = labels.some(l =>
              l === 'Concluído' || l === 'Recusado' || l === 'Duplicado' || l === 'Cancelado' || l.startsWith('resolution:')
            ) || issue.state_reason === 'duplicate';

            if (!hasResolution) {
              console.log(`Aviso: Issue #${issue.number} foi fechada sem label formal de resolução.`);
              // We do not fail the workflow to avoid disrupting GitHub operations,
              // but we log clearly and optionally comment if desired.
            } else {
              console.log(`Issue #${issue.number} fechada com resolução válida.`);
            }
